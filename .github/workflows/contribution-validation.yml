name: Contribution full validation
on:
  push:
    branches: ["validation/full-20261005"]
permissions:
  contents: read
jobs:
  build-all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        numpy-version: ['>=1.21,<2.0', '>=2.1']
        exclude:
          - python-version: '3.13'
            numpy-version: '>=1.21,<2.0'
          - python-version: '3.14'
            numpy-version: '>=1.21,<2.0'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5ccecc68d400d6aca3e204658cd6cc3483db8688
      - run: |
          docker build -f bin/all-py.Dockerfile \
            --build-arg PYTHON_VERSION="${{ matrix.python-version }}" \
            --build-arg NUMPY_VERSION="${{ matrix.numpy-version }}" \
            --tag gymnasium-all-docker .
      - name: Run tests
        run: docker run gymnasium-all-docker pytest tests/*
      # NumPy 1.x and 2.x have different scalar reprs and floating-point promotion behaviour
      - name: Run doctests for numpy >= 2.1
        if: matrix.numpy-version == '>=2.1'
        run: docker run gymnasium-all-docker pytest --doctest-modules gymnasium/

  build-necessary:
    runs-on:
      ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5ccecc68d400d6aca3e204658cd6cc3483db8688
      - run: |
           docker build -f bin/necessary-py.Dockerfile \
             --build-arg PYTHON_VERSION='3.10' \
             --tag gymnasium-necessary-docker .
      - name: Run tests
        run: |
           docker run gymnasium-necessary-docker pytest tests/test_core.py tests/envs/test_envs.py tests/spaces

  contribution-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5ccecc68d400d6aca3e204658cd6cc3483db8688
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pre-commit build
      - run: pre-commit run --all-files
      - run: python -m build
